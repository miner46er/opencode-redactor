# Test fixtures in this repository deliberately contain secret-shaped strings
# (the redaction detectors are judged against fake Slack/Stripe/AWS/... values).
# They are not credentials, but the prefix+length heuristics match their formats,
# so exclude the files that carry them from scanning and push protection.
paths-ignore:
  - "src/corpus.ts"
  - "src/rules.test.ts"
  # Denylist of provider *documentation* placeholders (e.g. Stripe's published
  # sk_test_ example) plus the matching README prose.
  - "src/rules.ts"
  - "README.md"
